name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: instabix
          POSTGRES_USER: instabix
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U instabix -d instabix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://vistabix_app:test@localhost:55432/instabix
      DATABASE_URL_ADMIN: postgres://instabix:test@localhost:55432/instabix
      AUTH_SECRET: ci-only-auth-secret-value-at-least-32-chars-long
      TOKEN_ENCRYPTION_KEY: /ItZjbcIhFEsruYM+J44PMzxGk3ip8WZOvzZfSWT2E8=
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create non-owner runtime role
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -p 55432 -U instabix -d instabix -v ON_ERROR_STOP=1 \
            -c "do \$\$ begin if not exists (select 1 from pg_roles where rolname = 'vistabix_app') then create role vistabix_app login password 'test' nosuperuser nobypassrls; end if; end \$\$;"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify (typecheck, lint, tests, build)
        run: npm run verify
